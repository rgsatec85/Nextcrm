name: Deploy

# Só dispara depois que o workflow CI terminar com sucesso na branch main —
# nunca faz deploy de um commit que não passou em lint/testes/build.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

jobs:
  deploy-backend:
    name: Deploy backend (Render)
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Disparar deploy hook do Render
        # Configure o secret RENDER_DEPLOY_HOOK_URL nas settings do repositório
        # (Render → seu serviço backend → Settings → Deploy Hook).
        run: |
          if [ -z "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ]; then
            echo "RENDER_DEPLOY_HOOK_URL não configurado — pulando deploy do backend."
            exit 0
          fi
          curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"

  deploy-frontend:
    name: Deploy frontend (Vercel)
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy para produção via Vercel CLI
        # Secrets necessários (Vercel → Project Settings → General e Tokens):
        #   VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "VERCEL_TOKEN não configurado — pulando deploy do frontend."
            exit 0
          fi
          npx vercel pull --yes --environment=production --token="$VERCEL_TOKEN" --cwd frontend
          npx vercel build --prod --token="$VERCEL_TOKEN" --cwd frontend
          npx vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN" --cwd frontend
